
services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-backend
    expose:
      - "3000"
    restart: unless-stopped
